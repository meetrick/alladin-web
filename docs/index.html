<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>알라딘 DOS</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/aladdin-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="https://v8.js-dos.com/8.xx/8.3.14/js-dos.css">
  <link rel="stylesheet" href="./style.css?v=8">
  <script defer src="https://v8.js-dos.com/8.xx/8.3.14/js-dos.js"></script>
  <script type="module" src="./game.js?v=4"></script>
</head>
<body>
  <main aria-label="알라딘 DOS 게임">
    <section class="cabinet" aria-label="게임 화면과 조작">
      <div class="screen">
        <div id="dos"></div>
        <div id="loading" class="game-status">
          <p id="status" role="status">알라딘을 불러오는 중…</p>
          <button id="retry" type="button" hidden>다시 시도</button>
        </div>
      </div>
      <fieldset id="controls" class="controls" disabled>
        <legend class="sr-only">터치 게임 조작</legend>
        <div class="dpad" role="group" aria-label="이동">
          <button type="button" data-key="265" aria-label="위">↑</button>
          <button type="button" data-key="263" aria-label="왼쪽">←</button>
          <button type="button" data-key="264" aria-label="아래">↓</button>
          <button type="button" data-key="262" aria-label="오른쪽">→</button>
        </div>
        <div class="right-controls">
          <div class="actions" role="group" aria-label="공격과 점프">
            <button class="action-apple" type="button" data-key="342">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-5-4-10 0-8 7 1 4 4 7 8 5 4 2 7-1 8-5 2-7-3-11-8-7Zm0 0c0-3 2-5 5-5"/></svg>
              사과
            </button>
            <button class="action-sword" type="button" data-key="341">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5m-8 9 3 3 6-6 1-8-8 1-6 6 3 3m-4 1 4 4m-7 2 1 1"/></svg>
              칼
            </button>
            <button class="action-jump" type="button" data-key="32">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 14 7-7 7 7m-12 6 5-5 5 5"/></svg>
              점프
            </button>
          </div>
          <div class="utility-controls" role="group" aria-label="DOS 메뉴 조작">
            <button type="button" data-key="257">엔터</button>
            <button type="button" data-key="256">뒤로</button>
            <button type="button" id="pause" aria-pressed="false">정지</button>
          </div>
        </div>
      </fieldset>
    </section>
  </main>
</body>
</html>
